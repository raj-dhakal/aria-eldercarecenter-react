name: Deploy website to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::807442884748:role/github-actions-deploy-website
          aws-region: us-east-2

      - name: Upload to S3
        run: aws s3 sync dist s3://aria-eldercarecenter-website --delete

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1E0G3LVU7NV85 --paths "/*"