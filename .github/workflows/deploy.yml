name: Deploy website to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Show login details (debug)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,json,base64;p=sys.stdin.read().strip();p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('sub:',d.get('sub'));print('aud:',d.get('aud'))"

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::807442884748:role/github-actions-deploy-website
          aws-region: us-east-2

      - name: Upload to S3
        run: aws s3 sync dist s3://aria-eldercarecenter-website --delete

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1E0G3LVU7NV85 --paths "/*"